name: CI

on:
  push:
    branches: [ main, "arena/b7a0b610-awesome-temporary-root" ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Use Node.js (runtime)
        uses: actions/setup-node@v7
        with:
          node-version: '26'

      - name: Use Bun (package manager)
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Validate Data
        run: bun run data:validate

      - name: Generate Data
        run: bun run data:generate

      - name: Run Tests
        run: bun run test

      - name: Build Website
        run: bun run build

      - name: Validate Build Output
        run: |
          if [ ! -f "dist/index.html" ]; then
            echo "Error: dist/index.html not found"
            exit 1
          fi
          ls -la dist

      # Build is the source of truth for deploy; produce the artifact here.
      - name: Upload site artifact
        uses: actions/upload-artifact@v7
        with:
          name: site
          path: dist
          retention-days: 1

  deploy:
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Download built site
        uses: actions/download-artifact@v8
        with:
          name: site
          path: dist

      - name: Deploy with Wrangler
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages publish dist --project-name temp-root-checker
