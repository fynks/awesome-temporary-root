name: CI
on:
  push:
    branches: [ main, "arena/b7a0b610-awesome-temporary-root" ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          
      - name: Install dependencies
        run: npm ci
        
      - name: Lint
        run: npm run lint
        
      - name: Validate Data
        run: npm run data:validate
        
      - name: Generate Data
        run: npm run data:generate
        
      - name: Run Tests
        run: npm test
        
      - name: Build Website
        run: npm run build
        
      - name: Validate Build Output
        run: |
          if [ ! -d "dist" ]; then
            echo "Error: dist directory not found"
            exit 1
          fi
          ls -la dist
