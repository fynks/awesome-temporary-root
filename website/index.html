<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Temp Root Checker</title>
  <meta name="description" content="Technical reference tool for Android temporary root compatibility by device, firmware, and kernel.">
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
</head>
<body>
  <header class="compact-header">
    <div class="header-content">
      <h1 class="site-title">Temp Root Checker</h1>
      <nav class="site-nav">
        <a href="/" class="nav-link active">Compatibility</a>
        <a href="/devices/" class="nav-link">Devices</a>
        <a href="/modules/" class="nav-link">Modules</a>
      </nav>
    </div>
  </header>

  <main class="content-container">
    <section id="checker" class="checker-section">
      <h2 class="section-title">Exact Compatibility Checker</h2>
      <form id="checker-form" class="checker-form">
        <div class="form-group">
          <label for="model">Model Number</label>
          <input type="text" id="model" name="model" placeholder="e.g. SM-S928B" required>
        </div>
        <div class="form-group">
          <label for="firmware">Firmware / Build</label>
          <input type="text" id="firmware" name="firmware" placeholder="e.g. S928BXXS6DZF2" required>
        </div>
        <div class="form-group">
          <label for="kernel">Kernel Version</label>
          <input type="text" id="kernel" name="kernel" placeholder="e.g. 6.1.145" required>
        </div>
        <button type="submit" class="btn-primary">Check Compatibility</button>
      </form>

      <div id="result-area" class="result-area hidden">
        <div id="result-content"></div>
      </div>
    </section>

    <section id="discovery" class="discovery-section hidden">
      <h2 class="section-title">Discovery</h2>
      <div class="search-tabs">
        <button class="tab-btn active" data-tab="devices">Devices</button>
        <button class="tab-btn" data-tab="modules">Modules</button>
      </div>
      <div class="search-container">
        <input type="text" id="search-input" placeholder="Search by name, model, firmware, kernel, or category...">
        <div id="search-results" class="search-results"></div>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="footer-content">
      <p>&copy; 2026 Temp Root Checker. Built from <a href="https://github.com/fynks/awesome-temporary-root">fynks/awesome-temporary-root</a>.</p>
      <p><a href="https://github.com/fynks/awesome-temporary-root/blob/main/CONTRIBUTING.md">Contributing</a> · <a href="https://github.com/fynks/awesome-temporary-root/issues">Issues</a></p>
    </div>
  </footer>

  <script type="module" src="js/app.js"></script>
</body>
</html>
